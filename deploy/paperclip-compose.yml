name: paperclip-stack
services:
  paperclip:
    image: node:20-bookworm-slim
    container_name: pc_app
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_BASE_URL: https://ollama.com/v1
      NODE_ENV: production
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      BETTER_AUTH_TRUSTED_ORIGINS: http://72.60.89.217:3100,http://localhost:3100,http://127.0.0.1:3100,http://srv1399420.hstgr.cloud:3100
      HERMES_AUTODETECT_PATCH_URL: https://raw.githubusercontent.com/Zakariakhchiche/ai-company-stack/main/deploy/patches/patch-hermes-autodetect.mjs
    volumes:
      - /root/paperclip-data:/data
      - /root/hermes-home:/home/node/.hermes
    command:
      - bash
      - -c
      - |
        set +e
        apt-get update -qq
        apt-get install -y --no-install-recommends -qq \
          git ca-certificates curl python3 python3-pip python3-venv >/dev/null
        npm install -g --silent paperclipai@latest typescript@5

        pip3 install --break-system-packages --quiet \
          git+https://github.com/NousResearch/hermes-agent 2>&1 | tail -2

        mkdir -p /data /home/node/.hermes
        chown -R node:node /data /home/node

        cat > /home/node/.hermes/config.yaml <<EOF
        model:
          provider: custom
          base_url: https://ollama.com/v1
          api_key: ${OLLAMA_API_KEY}
          name: glm-5.1
          context_length: 131072
        agent:
          max_turns: 90
        EOF
        cat > /home/node/.hermes/.env <<EOF
        OLLAMA_API_KEY=${OLLAMA_API_KEY}
        OLLAMA_BASE_URL=https://ollama.com/v1
        EOF
        chown -R node:node /home/node/.hermes

        PC_NM="$$(npm root -g)/paperclipai/node_modules"
        if [ -d "$$PC_NM" ]; then
          curl -sSfL "$$HERMES_AUTODETECT_PATCH_URL" -o /tmp/patch-hermes-autodetect.mjs
          if [ -s /tmp/patch-hermes-autodetect.mjs ]; then
            echo ">> patching paperclipai at $$PC_NM"
            node /tmp/patch-hermes-autodetect.mjs "$$PC_NM" 2>&1 || echo "patch failed (non-fatal)"
          fi
        fi

        if [ ! -f /data/instances/default/config.json ]; then
          timeout --preserve-status 25 runuser -u node -- paperclipai onboard -y --bind lan --data-dir /data
        fi
        runuser -u node -- node -e 'const f=require("fs");const p="/data/instances/default/config.json";const c=JSON.parse(f.readFileSync(p));c.server=c.server||{};c.server.allowedHostnames=[...new Set([...(c.server.allowedHostnames||[]),"72.60.89.217","srv1399420.hstgr.cloud","localhost","127.0.0.1"])];c.server.publicBaseUrl="http://72.60.89.217:3100";c.auth=c.auth||{};c.auth.baseUrlMode="explicit";c.auth.publicBaseUrl="http://72.60.89.217:3100";c.auth.trustedOrigins=["http://72.60.89.217:3100","http://localhost:3100","http://127.0.0.1:3100","http://srv1399420.hstgr.cloud:3100"];f.writeFileSync(p,JSON.stringify(c,null,2));'

        CP=""
        [ -f /data/admin-creds.env ] && CP=$$(grep '^ADMIN_PASSWORD=' /data/admin-creds.env | cut -d= -f2)
        if [ -z "$$CP" ]; then
          P=$$(head -c 16 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 16)
          printf 'ADMIN_EMAIL=admin@paperclip.local\nADMIN_PASSWORD=%s\n' "$$P" > /data/admin-creds.env
          chmod 600 /data/admin-creds.env
        fi
        . /data/admin-creds.env

        echo ">> hermes: $$(hermes --version 2>&1 | head -1)"
        echo ">> paperclipai: $$(paperclipai --version 2>&1 | head -1)"

        runuser -u node -- env HOME=/home/node \
          OLLAMA_API_KEY="${OLLAMA_API_KEY}" OLLAMA_BASE_URL="https://ollama.com/v1" \
          PYTHONIOENCODING=utf-8 PYTHONUTF8=1 \
          paperclipai run --data-dir /data > /tmp/pc.log 2>&1 &
        PC_PID=$$!

        for i in $$(seq 1 90); do
          sleep 2
          [ "$$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://localhost:3100/api/health 2>&1)" = "200" ] && break
        done
        sleep 3

        SJ=$$(curl -sS -c /tmp/c.txt -X POST http://localhost:3100/api/auth/sign-in/email -H "Content-Type: application/json" -d "{\"email\":\"$$ADMIN_EMAIL\",\"password\":\"$$ADMIN_PASSWORD\"}")
        if ! echo "$$SJ" | grep -q '"token"'; then
          curl -sS -c /tmp/c.txt -X POST http://localhost:3100/api/auth/sign-up/email -H "Content-Type: application/json" -d "{\"email\":\"$$ADMIN_EMAIL\",\"password\":\"$$ADMIN_PASSWORD\",\"name\":\"Admin\"}" >/dev/null
        fi
        CLI_OUT=$$(runuser -u node -- env HOME=/home/node paperclipai auth bootstrap-ceo --data-dir /data --force 2>&1)
        INV=$$(echo "$$CLI_OUT" | grep -oE 'pcp_bootstrap_[a-f0-9]+' | tail -1)
        O="http://localhost:3100"
        curl -sS -b /tmp/c.txt -H "Origin: $$O" -H "Referer: $$O/" -X POST "$$O/api/invites/$$INV/accept" -H "Content-Type: application/json" -d '{"requestType":"human"}' >/dev/null

        echo "=== DONE === email=$$ADMIN_EMAIL password=$$ADMIN_PASSWORD"
        wait $$PC_PID
