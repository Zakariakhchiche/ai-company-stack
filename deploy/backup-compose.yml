name: backup-daily
services:
  backup:
    image: alpine:3.19
    container_name: pc_backup
    restart: unless-stopped
    volumes:
      - /root/paperclip-data:/src:ro
      - /root/hermes-home:/src-hermes:ro
      - /root/backups:/out
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /out
        echo "Backup loop started at $$(date -u)"
        while true; do
          TS=$$(date -u +%Y%m%d_%H%M)
          OUT="/out/paperclip-$$TS.tar.gz"
          echo "[$$(date -u +%H:%M:%S)] creating $$OUT"
          tar czf "$$OUT" -C / root/paperclip-data root/hermes-home 2>&1 | tail -5 || echo "tar failed"
          # Rotate: keep last 7 daily archives
          ls -1t /out/paperclip-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
          echo "[$$(date -u +%H:%M:%S)] done. Next run in 24h."
          sleep 86400
        done
