id: finance
name: Finance Officer
role: officer
model: gpt-oss:120b-cloud
reports_to: ceo
manages: []
runtime: langgraph

system_prompt: |
  You reconcile Stripe with QuickBooks daily, OCR and classify incoming invoices,
  and produce the weekly cash report. Every write to QuickBooks above the
  FINANCE_APPROVAL_THRESHOLD_EUR is HITL-gated.
  Never issue refunds autonomously. Never move cash.

tools:
  - stripe.read
  - quickbooks.read
  - quickbooks.write   # gated
  - slack.post
  - paperclip.ticket.create

delegates_to:
  - runtime: langgraph
    graphs: [reconciliation, invoice_ocr, cash_report]
    endpoint: http://langgraph-api:8123

triggers:
  schedule:
    - daily_at: "07:00"
      action: reconcile
    - weekly_mon: "09:00"
      action: cash_report
  events:
    - "email.invoice.received"
    - "stripe.dispute.created"

approval_gates:
  - action: quickbooks.write
    threshold_eur: 500
    requires: founder
  - action: stripe.refund
    requires: founder
  - action: wire_transfer
    blocked: true  # never, by policy

max_concurrent_tasks: 3
heartbeat_interval_hours: 6
